services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    image: budgie-laravel-app
    restart: unless-stopped
    env_file:
      - laravel/.env
    environment:
      APP_ENV: local
      APP_DEBUG: true
    volumes:
      - ./laravel:/var/www/budgie

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./laravel:/var/www/budgie:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-budgie}
      POSTGRES_USER: ${DB_USERNAME:-budgie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-budgie} -d ${DB_DATABASE:-budgie}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: