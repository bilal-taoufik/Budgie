services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgie_app_prod
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: budgie_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: budgie_postgres_prod
    env_file:
      - ./src/.env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

volumes:
  postgres_prod_data: