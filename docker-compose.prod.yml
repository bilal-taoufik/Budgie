services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgie_app_prod
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - postgres

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgie_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www
    depends_on:
      - postgres
  nginx:
    image: nginx:alpine
    container_name: budgie_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: budgie_postgres_prod
    env_file:
      - ./src/.env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  postgres-backup:
    image: postgres:16-alpine
    container_name: budgie_postgres_backup_prod
    restart: unless-stopped
    env_file:
      - ./src/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_BACKUP_PATH: /backups
    volumes:
      - ./backups:/backups
      - ./docker/postgres/backup-database.sh:/usr/local/bin/backup-database.sh:ro
      - ./docker/postgres/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-entrypoint.sh"]
    depends_on:
      - postgres
volumes:
  postgres_prod_data:
