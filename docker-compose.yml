services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    image: budgie-laravel-app
    restart: unless-stopped
    env_file:
      - laravel/.env
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/laravel/vendor
      - app-storage:/var/www/html/laravel/storage
      - app-cache:/var/www/html/laravel/bootstrap/cache
    networks:
      - budgie

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/laravel/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - budgie

  queue:
    image: budgie-laravel-app
    restart: unless-stopped
    env_file:
      - laravel/.env
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "cd /var/www/html/laravel && if [ -f artisan ]; then php artisan queue:work --sleep=3 --tries=3 --timeout=90; else echo 'artisan not found, queue worker paused'; sleep infinity; fi"
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/laravel/vendor
      - app-storage:/var/www/html/laravel/storage
      - app-cache:/var/www/html/laravel/bootstrap/cache
    networks:
      - budgie

  scheduler:
    image: budgie-laravel-app
    restart: unless-stopped
    env_file:
      - laravel/.env
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "cd /var/www/html/laravel && if [ -f artisan ]; then while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done; else echo 'artisan not found, scheduler paused'; sleep infinity; fi"
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/laravel/vendor
      - app-storage:/var/www/html/laravel/storage
      - app-cache:/var/www/html/laravel/bootstrap/cache
    networks:
      - budgie

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-budgie}
      POSTGRES_USER: ${DB_USERNAME:-budgie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-budgie} -d ${DB_DATABASE:-budgie}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - budgie

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - budgie

networks:
  budgie:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  app-vendor:
  app-storage:
  app-cache:
