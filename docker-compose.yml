services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: budgie-laravel-app
    restart: unless-stopped
    env_file:
      - laravel/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app-public:/var/www/budgie/public
      - app-storage:/var/www/budgie/storage
      - app-cache:/var/www/budgie/bootstrap/cache
      - ./laravel/app:/var/www/budgie/app          
      - ./laravel/database:/var/www/budgie/database
      - ./laravel/resources:/var/www/budgie/resources 
      - ./laravel/routes:/var/www/budgie/routes
    networks:
      - budgie

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - app-public:/var/www/budgie/public:ro
      - app-storage:/var/www/budgie/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - budgie

  queue:
    image: budgie-laravel-app
    pull_policy: never
    restart: unless-stopped
    env_file:
      - laravel/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "cd /var/www/budgie && if [ -f artisan ]; then php artisan queue:work --sleep=3 --tries=3 --timeout=90; else echo 'artisan not found, queue worker paused'; sleep infinity; fi"
    volumes:
      - app-storage:/var/www/budgie/storage
      - app-cache:/var/www/budgie/bootstrap/cache
    networks:
      - budgie

  scheduler:
    image: budgie-laravel-app
    pull_policy: never
    restart: unless-stopped
    env_file:
      - laravel/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "cd /var/www/budgie && if [ -f artisan ]; then while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done; else echo 'artisan not found, scheduler paused'; sleep infinity; fi"
    volumes:
      - app-storage:/var/www/budgie/storage
      - app-cache:/var/www/budgie/bootstrap/cache
    networks:
      - budgie

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-budgie}
      POSTGRES_USER: ${DB_USERNAME:-budgie}
      POSTGRES_PASSWORD: "@Budgie2026!!"
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-budgie} -d ${DB_DATABASE:-budgie}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - budgie

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - budgie

networks:
  budgie:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  app-public:
  app-storage:
  app-cache:
